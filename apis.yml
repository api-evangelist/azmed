name: AZmed
description: >-
  AZmed is a Paris-based medical-imaging AI company whose Rayvolve AI Suite
  assists radiologists by automatically analyzing X-rays and other studies. Its
  applications include AZtrauma (fracture detection), AZchest (chest imaging),
  AZmeasure (anatomical measurements), AZboneage (bone-age assessment) and AZnod
  (CT nodule detection). The software integrates into existing radiology
  workflows rather than being exposed as a public developer API, and is deployed
  across 2,500+ healthcare centers in 55+ countries, analyzing over 15 million
  X-rays annually, backed by 10+ peer-reviewed publications. As of this profile
  AZmed does not publish a public REST API, developer portal, SDKs, or OpenAPI.
